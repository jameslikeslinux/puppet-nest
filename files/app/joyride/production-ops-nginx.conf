# Dormant production VPN endpoint. Never use the token-free TEST entry point.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 4k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  limit_conn_zone $binary_remote_addr zone=ops_clients:1m;
  limit_req_zone $binary_remote_addr zone=ops_requests:1m rate=5r/s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  ssl_certificate /tls/tls.crt;
  ssl_certificate_key /tls/tls.key;

  # Same-pod loopback only. The authenticated application never listens on PodIP.
  upstream joyride_ops { server 127.0.0.1:8001; }

  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
  }
  server {
    listen 8443 ssl;
    server_name joyride-ops.eyrie;
    if ($ssl_server_name != joyride-ops.eyrie) { return 421; }
    if ($http_host !~* "^joyride-ops\.eyrie(:443)?$") { return 421; }

    # Both existing OpenVPN pools; never trust forwarding/identity headers.
    # Service externalTrafficPolicy=Local and NetworkPolicy repeat this boundary.
    allow 172.22.0.0/24;
    deny all;
    limit_conn ops_clients 8;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host joyride.eyrie;
    proxy_set_header Connection "";
    # Preserve only the ordinary bearer credential; the app validates its scope.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;

    location = /ops/status {
      limit_req zone=ops_requests burst=10 nodelay;
      if ($request_uri != /ops/status) { return 404; }
      if ($request_method != GET) { return 405; }
      proxy_pass http://joyride_ops;
    }
    location = /ops/diagnostics {
      limit_req zone=ops_requests burst=10 nodelay;
      if ($request_uri != /ops/diagnostics) { return 404; }
      if ($request_method != GET) { return 405; }
      proxy_pass http://joyride_ops;
    }
    # No production deploy/controller/roster or invented admin interface.
    location / { return 404; }
  }
}
