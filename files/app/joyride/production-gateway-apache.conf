# Bounded informational gateway; upstream is static-only, never the member app.
# Supervised certificate covers BOTH names; full platform activation is separate.
<VirtualHost 45.77.156.204:80 [2001:19f0:1000:e1dc::204]:80>
  # Do not inherit a query/cookie-bearing access log for member login URLs.
  CustomLog /dev/null common
  LogLevel crit
  ServerName joyridedc.com
  ServerAlias www.joyridedc.com
  StrictHostCheck On
  DocumentRoot /srv/www/joyridedc.com
  <Directory /srv/www/joyridedc.com>
    Options None
    AllowOverride None
    Require all granted
  </Directory>
  RewriteEngine On
  RewriteCond %{HTTP_HOST} !^(www\.)?joyridedc\.com(:80)?$ [NC]
  RewriteRule ^ - [R=421,END]
  # Supervised Certbot webroot only; no proxy or automatic renewal.
  RewriteRule ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ - [END]
  RewriteRule ^/(.*)$ https://joyridedc.com/$1 [R=301,END]
</VirtualHost>

<VirtualHost 45.77.156.204:443 [2001:19f0:1000:e1dc::204]:443>
  CustomLog /dev/null common
  LogLevel crit
  ServerName www.joyridedc.com
  StrictHostCheck On
  SSLEngine On
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  SSLCertificateFile /etc/letsencrypt/live/joyridedc.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/joyridedc.com/privkey.pem
  RewriteEngine On
  RewriteCond %{SSL:SSL_TLS_SNI} !=www.joyridedc.com [OR]
  RewriteCond %{HTTP_HOST} !^www\.joyridedc\.com(:443)?$ [NC]
  RewriteRule ^ - [R=421,END]
  RewriteRule ^/(.*)$ https://joyridedc.com/$1 [R=301,END]
</VirtualHost>

<VirtualHost 45.77.156.204:443 [2001:19f0:1000:e1dc::204]:443>
  CustomLog /dev/null common
  LogLevel crit
  ServerName joyridedc.com
  StrictHostCheck On
  SSLEngine On
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  SSLCertificateFile /etc/letsencrypt/live/joyridedc.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/joyridedc.com/privkey.pem
  AllowEncodedSlashes Off
  RewriteEngine On
  RewriteCond %{SSL:SSL_TLS_SNI} !=joyridedc.com [OR]
  RewriteCond %{HTTP_HOST} !^joyridedc\.com(:443)?$ [NC]
  RewriteRule ^ - [R=421,END]
  # Defense in depth; the ONLY upstream is the unprivileged web origin.
  RewriteRule ^/+(ops|admin|delivery) - [R=404,END,NC]
  ProxyPassMatch "(?i)^/+(ops|admin|delivery)" "!"
  ProxyRequests Off
  ProxyPreserveHost Off
  ProxyAddHeaders Off
  RequestHeader unset Forwarded
  RequestHeader unset X-Forwarded-Host
  RequestHeader unset X-Forwarded-For
  RequestHeader unset X-Real-IP
  RequestHeader unset Tailscale-User-Login
  RequestHeader unset Tailscale-User-Name
  RequestHeader unset X-Joyride-Trusted-Test
  RequestHeader set X-Forwarded-Proto "https"
  SSLProxyEngine On
  SSLProxyVerify require
  SSLProxyCheckPeerName On
  SSLProxyCheckPeerExpire On
  SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
  ProxyPass / https://joyride.eyrie/ connectiontimeout=5 timeout=30
  ProxyPassReverse / https://joyride.eyrie/
</VirtualHost>
