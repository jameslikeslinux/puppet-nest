# Dedicated private TEST endpoint; never forward to a shared ingress listener.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  ssl_certificate /tls/tls.crt;
  ssl_certificate_key /tls/tls.key;

  upstream joyride_web { server joyride-test-web.test.svc.cluster.local:8000; }
  upstream joyride_ops { server joyride-test-ops.test.svc.cluster.local:8001; }

  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
  }
  server {
    listen 8443 ssl;
    server_name joyride-test.eyrie;
    # Reject a valid SNI with another Host, and a valid Host with another SNI.
    if ($ssl_server_name != joyride-test.eyrie) { return 421; }
    if ($http_host !~* "^joyride-test\.eyrie(:443)?$") { return 421; }
    proxy_http_version 1.1;
    proxy_set_header Host joyride-test.eyrie;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location = /ops/status { proxy_pass http://joyride_ops; }
    location = /ops/diagnostics { proxy_pass http://joyride_ops; }
    location = /ops/deploy { proxy_pass http://joyride_ops; }
    location /ops { return 404; }
    location /delivery { return 404; }
    location /admin { return 404; }
    location / { proxy_pass http://joyride_web; }
  }
  # Kubelet-only readiness listener; it has no LoadBalancer or Service port.
  server {
    listen 8080;
    location = /health/live { return 200 "ready\n"; }
    location / { return 404; }
  }
}
