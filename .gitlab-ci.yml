---
default:
  interruptible: true

stages:
  - 'Test'
  - 'Build'
  - 'Deploy'

.all-branch-ci:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

'Validate':
  extends: .all-branch-ci
  image: '${CI_REGISTRY}/nest/tools/pdk'
  stage: 'Test'
  script:
    - 'pdk validate'

'Unit Test':
  extends: .all-branch-ci
  image: '${CI_REGISTRY}/nest/tools/pdk'
  stage: 'Test'
  script:
    - 'pdk test unit --parallel'

'Joyride private access':
  extends: .all-branch-ci
  image: 'registry.gitlab.joyfullee.me/nest/tools/agent@sha256:820cc8a130309a07db90685958bb9cac87d8376ab63f2d45457e87431ad93e34'
  stage: 'Test'
  tags: ['owl']
  variables:
    PYTHONDONTWRITEBYTECODE: '1'
  script:
    - 'python3 spec/app/joyride/test_private_access.py'
    - 'python3 spec/app/joyride/test_production_ops.py'
    - 'python3 spec/app/joyride/test_production_gateway.py'
    - 'python3 -m venv .production-boundary-venv'
    - '.production-boundary-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
    - '.production-boundary-venv/bin/python spec/app/joyride/test_production_boundaries.py'
    - '.production-boundary-venv/bin/python spec/app/joyride/test_runtime_ownership.py'


'Secure browser fixtures':
  extends: .all-branch-ci
  image: 'mirror.gcr.io/library/node@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0'
  stage: 'Test'
  variables:
    PYTHONDONTWRITEBYTECODE: '1'
    SECURE_BROWSER_CONTROL_MODE: 'firefox-ui-v1'
  script:
    - 'python3 spec/app/hermes/test_secure_browser_text_reads.py'
    - 'python3 spec/app/hermes/test_secure_browser_bidi_ui.py'
    - 'python3 spec/app/hermes/test_firefox_ui_bridge.py'
    - 'python3 spec/app/hermes/test_firefox_reliability.py'
    - 'python3 spec/app/hermes/test_firefox_endpoint.py'
    - 'python3 spec/app/hermes/test_firefox_tab_ancestry.py'
    - 'python3 spec/app/hermes/test_secure_browser_firefox_ui.py'
    - 'python3 spec/app/hermes/test_secure_browser_general_hardening.py'
    - 'python3 spec/app/hermes/test_firefox_input_confirmation.py'

.template:
  stage: 'Build'
  script:
    - 'mkdir empty'
    - 'podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" <<< $CI_REGISTRY_PASSWORD'
    - 'podman build
        --build-arg=BOLT_IMAGE="${BOLT_IMAGE:-nest/tools/bolt}"
        --build-arg=BRANCH="$CI_COMMIT_BRANCH"
        --build-arg=REPOSITORY="$CI_REPOSITORY_URL"
        --build-arg=SOURCE_URL="${CI_PROJECT_URL}.git"
        --dns=172.22.4.3
        --file=Containerfile
        --secret=id=ssh_private_key,src="$NEST_CI_PRIVATE_KEY_FILE"
        --squash
        --tag="${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CPU}"
        empty'
    - 'podman push "${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CPU}"'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUILD == $CPU'
    - if: '$EXECUTOR_ONLY == "true" && $BUILD == $CPU'
    - if: '$EXECUTOR_ONLY == "true" && $BUILD'
      when: never
    - if: '$EXECUTOR_ONLY == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUILD'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

'Build haswell':
  extends: .template
  tags: ['amd64']
  variables:
    CPU: 'haswell'

'Build cortex-a53':
  extends: .template
  tags: ['arm64']
  variables:
    CPU: 'cortex-a53'

'Build sifive-u74':
  extends: .template
  tags: ['riscv64']
  variables:
    CPU: 'sifive-u74'

'Deploy environment':
  stage: 'Deploy'
  tags: ['r10k']
  script:
    - 'r10k deploy environment "$CI_COMMIT_BRANCH" --modules --verbose'
  rules:
    - if: '$EXECUTOR_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

'Deploy image':
  stage: 'Deploy'
  variables:
    IMAGE: "${CI_PROJECT_PATH}/${CI_COMMIT_REF_SLUG}"
  script:
    - 'podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" <<< $CI_REGISTRY_PASSWORD'
    - 'podman login -u admin --password-stdin registry.eyrie <<< $EYRIE_REGISTRY_PASSWORD'
    - 'LOCAL_IMAGE="${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:manifest-${CI_PIPELINE_ID}"'
    - 'cleanup() { podman manifest rm "$LOCAL_IMAGE" || true; }; trap cleanup EXIT'
    - 'podman manifest exists "$LOCAL_IMAGE" && podman manifest rm "$LOCAL_IMAGE"'
    - 'podman manifest create "$LOCAL_IMAGE"'
    - 'podman manifest add "$LOCAL_IMAGE" "${CI_REGISTRY}/${IMAGE}:haswell"'
    - 'podman manifest add "$LOCAL_IMAGE" "${CI_REGISTRY}/${IMAGE}:cortex-a53"'
    - 'podman manifest add "$LOCAL_IMAGE" "${CI_REGISTRY}/${IMAGE}:sifive-u74"'
    - 'podman manifest push --all "$LOCAL_IMAGE" "${CI_REGISTRY}/${IMAGE}:latest"'
    - 'podman manifest push --all "$LOCAL_IMAGE" "registry.eyrie/${IMAGE}:latest"'
  rules:
    - if: '$EXECUTOR_ONLY == "true" && $BUILD'
      when: never
    - if: '$EXECUTOR_ONLY == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
