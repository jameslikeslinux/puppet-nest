---
description: 'Deactivate a node and revoke its certs'

parameters:
  name:
    description: 'Certname of the node to delete'
    type: Pattern[/\A[a-zA-Z0-9][a-zA-Z0-9_.-]*\z/]

  namespace:
    description: 'OpenVox namespace whose CA and PuppetDB own the node'
    type: Enum['default', 'test']
    default: default

steps:
  - description: 'Clean the OpenVox CA identity'
    command: "kubectl exec -n ${namespace} deploy/puppet-puppetserver -c puppet-puppetserver -- puppetserver ca clean --certname ${name}"
    targets: localhost

  - description: 'puppet node deactivate'
    command: "kubectl exec -n ${namespace} deploy/puppet-puppetserver -c puppet-puppetserver -- puppet node deactivate ${name}"
    targets: localhost
