---
description: 'Deploy approved static-only Joyride informational site; no membership activation'
parameters:
  render_to:
    type: String
    default: ''
steps:
  - plan: nest::kubernetes::deploy
    parameters:
      service: joyride-info
      app: joyride-info
      namespace: joyride-info
      init: false
      wait: true
      render_to: $render_to
