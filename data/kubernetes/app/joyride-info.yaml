---
# Joy approved the merged informational frontend, not the member platform.
include:
- nest::service::joyride_info
service_name: joyride-info
fqdn: joyride.eyrie
# Personal application pipeline 10760, job 43233; independently copied and verified.
joyride_info_image: registry.eyrie/joy/joyride-info@sha256:545368db06fbe67edd3d8febc375ad5486d5e613691823222a05622478900f8d
affinity: {}
tolerations: []
resources:
  backup: {}
  restore: {}
  nest_registry_auths: {}

  app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-info
      namespace: joyride-info
    spec:
      replicas: 2
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: joyride-info
      template:
        metadata:
          labels:
            app: joyride-info
          annotations:
            joyride/source: 73c0575179ab995979f9756c6be750f4903d4781
            joyride/release: luna-frontend-v6-2026-10-20-r4

        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: web
            image: '%{lookup(''joyride_info_image'')}'
            ports:
            - name: web
              containerPort: 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: '1'
                memory: 128Mi
            readinessProbe:
              httpGet: &probe
                path: /health/ready
                port: web
                httpHeaders:
                - name: Host
                  value: joyride.eyrie
            livenessProbe:
              httpGet:
                <<: *probe
                path: /health/live

  web:
    apiVersion: v1
    kind: Service
    metadata:
      name: joyride-info
      namespace: joyride-info
    spec:
      selector:
        app: joyride-info
      ports:
      - name: web
        port: 8000
        targetPort: web
  certificate:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: joyride-info
      namespace: joyride-info
    spec:
      secretName: joyride-info-tls
      issuerRef:
        name: eyrie-ca
        kind: ClusterIssuer
      dnsNames: [joyride.eyrie]
  ingress:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: joyride-info
      namespace: joyride-info
    spec:
      ingressClassName: contour
      tls:
      - hosts: [joyride.eyrie]
        secretName: joyride-info-tls
      rules:
      - host: joyride.eyrie
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joyride-info
                port:
                  number: 8000
  policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-info
      namespace: joyride-info
    spec:
      podSelector:
        matchLabels:
          app: joyride-info
      policyTypes: [Ingress, Egress]
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: projectcontour
          podSelector:
            matchLabels:
              app.kubernetes.io/component: envoy
        ports:
        - protocol: TCP
          port: 8000
      egress: []
