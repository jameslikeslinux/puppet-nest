---
nest::classes:
  - 'nest::service::kubernetes'

nest::bird_role: worker
nest::external_interfaces: ['end0']
nest::wifi: false
nest::dtb_file: 'broadcom/bcm2712-rpi-500.dtb'
nest::fscache: true
nest::journal: persistent
nest::monitor_layout: ['HDMI-A-1@0', 'HDMI-A-2@2560']
nest::primary_monitor: 'HDMI-A-1'
nest::text_scaling_factor: 1.1
puppet::agent_server_hostname: 'puppet.eyrie'
