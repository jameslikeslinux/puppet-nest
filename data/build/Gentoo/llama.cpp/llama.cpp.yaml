---
nest::classes:
  - 'nest::tool::llamacpp'

# b11572 retains qwen35/qwen35moe and incorporates Vulkan flash-attention
# bounds/stale-buffer fixes and AMD iGPU checkpoint improvements. Stop before
# b11573's new f16 FMA path; validate our existing models/backends on hardware.
nest::tool::llamacpp::revision: 'efe3626b119ff81033e309c3ba07a770bef2c546'
# Zen5 is Joy's Strix Halo/llama-qwen comparison target. Keep Vulkan as the
# default `llama-server` while also building stock ROCm for deliberate
# benchmark/backend comparison.
nest::tool::llamacpp::build_rocm: true
nest::tool::llamacpp::rocm_amdgpu_targets: ['gfx1100', 'gfx1151']
nest::use: ['vulkan']

nest::package_keywords:
  # ROCm/HIP 7.2 stack for the zen5 Strix Halo ROCm llama.cpp build.
  dev-build/rocm-cmake: {}
  dev-libs/rocm-comgr: {}
  dev-libs/rocm-core: {}
  dev-libs/rocm-device-libs: {}
  dev-libs/rocr-runtime: {}
  dev-libs/roct-thunk-interface: {}
  dev-util/hip: {}
  dev-util/hipcc: {}
  dev-util/rocminfo: {}
  dev-util/rocm-smi: {}
  dev-util/Tensile: {}
  llvm-core/clang: {}
  llvm-core/clang-common: {}
  llvm-core/clang-linker-config: {}
  llvm-core/clang-toolchain-symlinks: {}
  llvm-core/lld: {}
  llvm-core/lld-toolchain-symlinks: {}
  llvm-core/llvm: {}
  llvm-core/llvm-toolchain-symlinks: {}
  llvm-core/llvmgold: {}
  llvm-runtimes/clang-rtlib-config: {}
  llvm-runtimes/clang-runtime: {}
  llvm-runtimes/clang-stdlib-config: {}
  llvm-runtimes/clang-unwindlib-config: {}
  llvm-runtimes/compiler-rt: {}
  llvm-runtimes/compiler-rt-sanitizers: {}
  llvm-runtimes/openmp: {}
  sci-libs/hipBLAS: {}
  sci-libs/hipBLAS-common: {}
  sci-libs/hipBLASLt: {}
  sci-libs/rocBLAS: {}

